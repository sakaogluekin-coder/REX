<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>SkorTakip – Canlı Skor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#161b22;--mu:#6b7280;--ln:#e5e7eb;--hd:#0b6b3a;--ac:#f5b800;--lv:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#e8ecf1;--mu:#8b95a3;--ln:#262d37;--hd:#0f4d2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:5}
.w{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--ac)}
input{flex:1;min-width:0;border:0;border-radius:20px;padding:8px 14px;font:inherit;background:rgba(255,255,255,.18);color:#fff;outline:0}
input::placeholder{color:rgba(255,255,255,.7)}
#up{font-size:11px;opacity:.8;white-space:nowrap}
.tabs{display:flex;margin-top:8px}
.tabs button{flex:1;border:0;background:none;color:rgba(255,255,255,.75);padding:10px 6px;font:600 14px inherit;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-color:var(--ac)}
.tabs i{font-style:normal;background:var(--lv);border-radius:9px;padding:0 6px;margin-left:4px;font-size:11px}
main{max-width:820px;margin:0 auto;padding:10px}
#dates{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px}
#dates button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:13px inherit;cursor:pointer;line-height:1.25}
#dates button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
#dates small{display:block;font-size:11px;opacity:.7}
.lg{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.lh{padding:9px 14px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--hd) 10%,var(--card));cursor:pointer;display:flex;gap:8px}
.lh span{margin-left:auto;color:var(--mu);font-weight:500}
.m{display:grid;grid-template-columns:58px 1fr 30px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--ln)}
.st{font-size:12px;color:var(--mu);text-align:center}
.st.l{color:var(--lv);font-weight:700}
.st.l:after{content:"'";animation:b 1s infinite}@keyframes b{50%{opacity:0}}
.tm{display:flex;align-items:center;gap:8px;padding:2px 0}
.tm img{width:18px;height:18px;object-fit:contain}
.tm.w{font-weight:700}
.sc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sc div{padding:2px 0}.sc .g{color:var(--lv)}
.e{text-align:center;color:var(--mu);padding:50px 10px}
</style>
</head>
<body>
<header><div class="w">
 <div class="top"><div class="logo">Skor<b>Takip</b></div><input id="q" type="search" placeholder="Takım veya lig ara…"><span id="up"></span></div>
 <div class="tabs" id="tabs"></div>
</div></header>
<main><div id="dates"></div><div id="list"></div></main>
<script>
const REFRESH = 30;                     // saniye: sayfa kaç saniyede bir sunucudan veri istesin
const TZ = "Europe/Istanbul";
const LIVE = ["1H","HT","2H","ET","BT","P","LIVE","INT","SUSP"], FIN = ["FT","AET","PEN"], SCH = ["NS","TBD"];
const PIN = ["Süper Lig","Super Lig","Premier League","La Liga","Serie A","Bundesliga","Ligue 1","UEFA Champions League"];
const $ = id => document.getElementById(id);
const dstr = d => d.toLocaleDateString("sv-SE", {timeZone: TZ});
let sel = dstr(new Date()), tab = "all", q = "", data = [], shut = {}, last = null;

const kind = s => LIVE.includes(s) ? "L" : FIN.includes(s) ? "F" : SCH.includes(s) ? "S" : "O";
const OTH = {PST:"Ertelendi",CANC:"İptal",ABD:"Yarıda",AWD:"Hükmen",WO:"WO",SUSP:"Askıda"};

async function load() {
  try {
    const r = await fetch("/api/fixtures?date=" + sel);
    const j = await r.json();
    if (Array.isArray(j)) { data = j; last = new Date(); }
  } catch (e) {}
  render();
}
function dates() {
  const out = [];
  for (let i = -3; i <= 3; i++) {
    const d = new Date(Date.now() + i * 864e5), k = dstr(d);
    out.push(`<button class="${k===sel?"on":""}" data-k="${k}">${d.toLocaleDateString("tr-TR",{timeZone:TZ,day:"numeric",month:"short"})}<small>${i===0?"Bugün":d.toLocaleDateString("tr-TR",{timeZone:TZ,weekday:"short"})}</small></button>`);
  }
  $("dates").innerHTML = out.join("");
  $("dates").querySelectorAll("button").forEach(b => b.onclick = () => { sel = b.dataset.k; data = []; load(); });
}
function row(m) {
  const k = kind(m.s), sc = k === "S" || m.hs == null;
  const st = k === "L" ? (m.s === "HT" ? "DA" : `<span>${m.min ?? ""}</span>`)
           : k === "F" ? "MS" : k === "S" ? new Date(m.t).toLocaleTimeString("tr-TR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}) : (OTH[m.s]||m.s);
  const hw = k === "F" && m.hs > m.as, aw = k === "F" && m.as > m.hs, c = k === "L" ? "g" : "";
  return `<div class="m"><div class="st ${k==="L"&&m.s!=="HT"?"l":""}">${st}</div>
   <div><div class="tm ${hw?"w":""}"><img src="${m.hl}" alt="" loading="lazy">${m.h}</div><div class="tm ${aw?"w":""}"><img src="${m.al}" alt="" loading="lazy">${m.a}</div></div>
   <div class="sc"><div class="${c}">${sc?"–":m.hs}</div><div class="${c}">${sc?"–":m.as}</div></div></div>`;
}
function render() {
  dates();
  const liveN = data.filter(m => kind(m.s) === "L").length;
  $("tabs").innerHTML = [["all","Tümü"],["L","Canlı"],["F","Biten"],["S","Başlamayan"]]
    .map(([k,n]) => `<button class="${tab===k?"on":""}" data-k="${k}">${n}${k==="L"&&liveN?`<i>${liveN}</i>`:""}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.k; render(); });
  $("up").textContent = last ? "Güncellendi " + last.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) : "";

  const ql = q.toLocaleLowerCase("tr");
  const L = data.filter(m => (tab==="all" || kind(m.s)===tab) &&
    (!ql || (m.h+" "+m.a+" "+m.lg+" "+m.ct).toLocaleLowerCase("tr").includes(ql)));
  const g = {};
  L.forEach(m => (g[m.ct + " · " + m.lg] ??= {pin: PIN.indexOf(m.lg), ms: []}).ms.push(m));
  const keys = Object.keys(g).sort((a,b) => {
    const pa = g[a].pin < 0 ? 99 : g[a].pin, pb = g[b].pin < 0 ? 99 : g[b].pin;
    return pa - pb || a.localeCompare(b, "tr");
  });
  $("list").innerHTML = keys.map(n => {
    const ms = g[n].ms.sort((a,b) => new Date(a.t) - new Date(b.t));
    return `<div class="lg"><div class="lh" data-l="${n}">⚽ ${n}<span>${ms.length} ${shut[n]?"▸":"▾"}</span></div>${shut[n]?"":ms.map(row).join("")}</div>`;
  }).join("") || `<div class="e">${last ? "Bu filtrede maç yok." : "Yükleniyor…"}</div>`;
  $("list").querySelectorAll(".lh").forEach(h => h.onclick = () => { shut[h.dataset.l] = !shut[h.dataset.l]; render(); });
}
$("q").oninput = e => { q = e.target.value.trim(); render(); };
load();
setInterval(() => { if (!document.hidden) load(); }, REFRESH * 1000);
</script>
</body>
</html>
